name: Hent nyheter

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent nyheter
        run: python scripts/fetch_news.py
      - name: Lagre news.json
        run: |
          git config user.name "infoskjerm-bot"
          git config user.email "infoskjerm-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Oppdater nyheter"
          git pull --rebase origin main
          git push
