<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}</style>
<title>Kontorets infoskjerm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 16:9 TV. Header with logo + clock, big featured story left, "next up" list right, ticker along the bottom.
   Single dark look built on the Enios navy, since it hangs on a wall. */
:root {
  --deep: #111b2b;      /* page ground, darkened Enios navy */
  --brand: #2d4164;     /* Enios navy from the logo */
  --panel: #18253a;
  --line: #2a3a55;
  --fg: #eef2f7;
  --muted: #9aa8bd;
  --accent: #f2a541;    /* safety orange, ROV paint */
  --sea: #4fc0cf;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--deep); color: var(--fg); font-family: var(--body); overflow: hidden; }
.screen { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

/* Header */
header { display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding-block: 1.1vw; padding-left: max(2.2vw, env(safe-area-inset-left, 0px)); padding-right: max(2.2vw, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); }
.logo { height: clamp(28px, 3.6vw, 72px); width: auto; color: #fff; display: block; }
.clock { display: flex; align-items: baseline; gap: 1.2vw; font-variant-numeric: tabular-nums; }
.clock span { color: var(--muted); font-size: clamp(12px, 1.1vw, 22px); text-transform: capitalize; }
.clock b { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 3.4vw, 68px); line-height: 1; }

/* Main */
main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 2vw; min-height: 0;
  padding-block: 2vw; padding-left: max(2.2vw, env(safe-area-inset-left, 0px)); padding-right: max(2.2vw, env(safe-area-inset-right, 0px)); }
.feature { position: relative; overflow: hidden; background: var(--brand); min-height: 0; display: flex; align-items: flex-end; }
.feature .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.feature.has-img .bg { animation: drift 14s ease-out forwards; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.06); } }
.feature:not(.has-img) .bg {
  background: radial-gradient(110% 80% at 85% 0%, #3f5a86 0%, transparent 60%),
              repeating-linear-gradient(-8deg, transparent 0 46px, rgba(255,255,255,.035) 46px 48px), var(--brand); }
.feature .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(10,16,28,.92) 100%); }
.feature .txt { position: relative; padding: 2.6vw; display: grid; gap: 1vw; max-width: 100%; animation: rise .7s ease both; }
.feature h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(26px, 3.6vw, 76px); line-height: 1.02; text-wrap: balance; max-width: 24ch; }
.feature p { margin: 0; font-size: clamp(13px, 1.25vw, 24px); color: #d5dce6; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { color: var(--muted); font-size: clamp(11px, 1vw, 19px); }
.progress { position: absolute; top: 0; left: 0; height: 4px; background: var(--accent); width: 0; }
.progress.run { animation: fill linear forwards; }
@keyframes fill { to { width: 100%; } }

.tag { justify-self: start; font-family: var(--mono); font-size: clamp(9px, .75vw, 15px); text-transform: uppercase; letter-spacing: .08em;
  padding: 3px 8px; border: 1px solid currentColor; background: rgba(10,16,28,.5); }
.t-norden { color: var(--sea); } .t-afrika { color: var(--accent); } .t-global { color: #c3cedb; }
.t-trond { color: #a3d68e; } .t-bors { color: #c9a8f0; } .t-norge { color: #ee9494; }

.next { display: flex; flex-direction: column; gap: 1vw; min-height: 0; min-width: 0; }
.next h3 { margin: 0; font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
  font-size: clamp(13px, 1.1vw, 22px); color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: .6vw;
  display: flex; justify-content: space-between; align-items: baseline; }
.next h3 small { font-family: var(--mono); font-weight: 500; letter-spacing: .04em; text-transform: none; font-size: clamp(9px, .7vw, 13px); }
.next ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.2vw; overflow: hidden; flex: 1; }
.next li { display: grid; grid-template-columns: 6.5vw minmax(0, 1fr); gap: 1vw; align-items: start; animation: rise .6s ease both; }
.thumb { width: 6.5vw; aspect-ratio: 4 / 3; max-width: 100%; background: var(--panel) center / cover; border: 1px solid var(--line); }
.next li div { display: grid; gap: .3vw; min-width: 0; }
.next h4 { margin: 0; font-weight: 500; font-size: clamp(13px, 1.15vw, 23px); line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Ticker */
.ticker { display: flex; align-items: center; background: var(--accent); color: #1a1206; overflow: hidden; }
.ticker strong { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: clamp(13px, 1.1vw, 21px);
  padding: .6vw 1.4vw; padding-left: max(1.4vw, env(safe-area-inset-left, 0px)); background: var(--deep); color: var(--accent); white-space: nowrap; }
.track { white-space: nowrap; display: inline-block; padding-left: 100%; animation: tick 150s linear infinite; font-weight: 500; font-size: clamp(13px, 1.1vw, 21px); }
.track span::after { content: "  ◆  "; opacity: .55; }
@keyframes tick { to { transform: translateX(-100%); } }
.demo-note { font-family: var(--mono); font-size: clamp(9px, .7vw, 13px); color: var(--accent); }

@media (max-width: 760px) {
  body { overflow: auto; }
  .screen { height: auto; }
  main { grid-template-columns: 1fr; gap: 18px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .feature { min-height: 62vw; }
  .feature .txt { padding: 16px; gap: 8px; }
  .next li { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; }
  .thumb { width: 64px; }
  .next ul, .next { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .feature .bg, .feature .txt, .next li { animation: none !important; }
  .track { animation-duration: 500s; }
}
</style>
</head>

<script>
/* ============ INNSTILLINGER — endre her ============ */
const CONFIG = {
  storySeconds: 20,        // hvor lenge hver hovedsak vises
  tickerSeconds: 25,       // sekunder den rullende teksten bruker på å krysse skjermen én gang. Høyere tall = saktere.
  listCount: 5,            // antall saker i "Neste"-listen
  refreshMinutes: 15,
  newsFile: "news.json",   // ferdig hentede nyheter fra serveren (GitHub-jobben). Finnes den ikke, hentes alt fra nettleseren.
  // Nettlesere får ikke lese RSS direkte fra andre sider, så vi går via en gratis mellomtjener. Prøver neste hvis en feiler.
  proxies: [
    "",                                            // først direkte, i tilfelle kilden tillater det
    "https://api.allorigins.win/raw?url=",
    "https://corsproxy.io/?url=",
    "https://api.codetabs.com/v1/proxy?quest=",
  ],
  rss2json: "https://api.rss2json.com/v1/api.json?rss_url=",   // reserve hvis alle over feiler

  // Børsmeldinger fra Oslo Børs (Newsweb). Bare selskaper hvis navn inneholder ett av disse ordene vises.
  bors: {
    tag: "Oslo Børs", cls: "t-bors", weight: 3, days: 7, max: 10,
    companies: ["DOF", "Moreld", "BW Energy", "BW Offshore", "Equinor", "Aker BP", "Vår Energi", "Aker Solutions",
      "Subsea 7", "Subsea7", "Reach Subsea", "Odfjell", "Solstad", "Havila Shipping", "Eidesvik", "Siem Offshore",
      "Okea", "DNO", "Panoro", "TGS", "Archer", "Borr Drilling", "Seadrill", "Shelf Drilling", "Northern Ocean", "Akastor"],
  },

  // RSS-kilder. region: true = saken merkes Norden/Afrika/Globalt ut fra teksten.
  // onlyOffshore: true = bare saker som handler om offshore/subsea/olje og gass tas med.
  feeds: [
    { name: "Offshore Energy", weight: 2, region: true, onlyOffshore: true,
      url: "https://www.offshore-energy.biz/feed/" },
    { name: "gCaptain Offshore", weight: 2, region: true,
      url: "https://gcaptain.com/category/offshore-news/feed/" },
    { name: "Splash247", weight: 1, region: true, onlyOffshore: true,
      url: "https://splash247.com/feed/" },
    { name: "Subsea Norden (Bing)", weight: 2, region: true,
      url: "https://www.bing.com/news/search?q=subsea+(Norway+OR+%22North+Sea%22+OR+Equinor+OR+Barents)&format=rss&mkt=en-US" },
    { name: "Subsea Afrika (Bing)", weight: 2, region: true,
      url: "https://www.bing.com/news/search?q=subsea+(Africa+OR+Angola+OR+Nigeria+OR+Mozambique+OR+Namibia+OR+Ghana)&format=rss&mkt=en-US" },
    { name: "NRK Trøndelag", tag: "Trøndelag", cls: "t-trond", weight: 1, max: 4,
      url: "https://www.nrk.no/trondelag/toppsaker.rss" },
    { name: "NRK", tag: "Norge", cls: "t-norge", weight: 1, max: 4,
      url: "https://www.nrk.no/toppsaker.rss" },
  ],
};

// Words used to sort stories into regions and to keep only offshore-related stories from broad feeds
const OFFSHORE = /subsea|offshore|fpso|\brigs?\b|drill|\boil\b|\bgas\b|\bROV\b|vessel|\bPSV\b|AHTS|pipeline|LNG|field|reservoir|platform|Equinor|Aker BP|Vår Energi|DOF|Moreld|BW Energy|TechnipFMC|Subsea ?7|Saipem|Oceaneering|North Sea|Nordsjø/i;
const AFRICA = /Africa|Afrika|Angola|Nigeria|Mozambique|Namibia|Ghana|Senegal|Egypt|Ivory Coast|Côte d.Ivoire|Congo|Gabon|Cameroon|Tanzania|Mauritania|Equatorial Guinea|Libya|Algeria/i;
const NORDIC = /Norw|Norge|North Sea|Nordsjø|Barents|Denmark|Danish|Iceland|Faroe|Sweden|Swedish|Finland|Equinor|Aker BP|Vår Energi|Okea|Hammerfest|Bergen|Stavanger|Trondheim/i;
/* =================================================== */

const $ = id => document.getElementById(id);

function tick() {
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
}
tick(); setInterval(tick, 10000);

const DEMO = [
  { tag: "Oslo Børs", cls: "t-bors", weight: 3 }, { tag: "Offshore · Norden", cls: "t-norden", weight: 3 },
  { tag: "Offshore · Afrika", cls: "t-afrika", weight: 3 }, { tag: "Trøndelag", cls: "t-trond", weight: 1 }, { tag: "Norge", cls: "t-norge", weight: 1 },
].map((d, i) => ({ ...d, date: new Date(Date.now() - i * 3e6), title: `Eksempel: siste sak fra «${d.tag}» vises her`,
  summary: "Ingress fra saken vises under overskriften når kilden har en.", source: "Demo, ikke ekte nyhet", img: "" }));

const MEDIA = "http://search.yahoo.com/mrss/";
function firstImg(html) { const m = /<img[^>]+src=["']([^"']+)/i.exec(html || ""); return m ? m[1] : ""; }
function safeUrl(u) { return /^https?:/i.test(u) ? u.replace(/["'()\\\s]/g, encodeURIComponent) : ""; }
function strip(html) { const d = document.createElement("div"); d.innerHTML = html || ""; return d.textContent.trim(); }

// Raw entries from either RSS (via a proxy) or rss2json, in one shape
const diag = [];   // what failed, shown on screen when no news could be loaded
function note(f, via, why) { diag.push(`${f.name} via ${via || "direkte"}: ${why}`); }

// Oslo Børs announcements from the Newsweb JSON API, filtered to the companies in CONFIG.bors
async function loadBors() {
  const c = CONFIG.bors, f = { name: "Oslo Børs" };
  const day = d => d.toISOString().slice(0, 10);
  const url = "https://api3.oslo.oslobors.no/v1/newsreader/list?category=&issuer=&market=&messageTitle="
    + `&fromDate=${day(new Date(Date.now() - c.days * 864e5))}&toDate=${day(new Date())}`;
  for (const proxy of CONFIG.proxies) {
    const via = proxy && new URL(proxy).hostname;
    try {
      const res = await fetch(proxy ? proxy + encodeURIComponent(url) : url, { signal: AbortSignal.timeout(12000) });
      if (!res.ok) { note(f, via, "svar " + res.status); continue; }
      const data = await res.json();
      const list = data?.data?.messages || data?.messages || [];
      if (!list.length) { note(f, via, "ingen meldinger i svaret"); continue; }
      const want = new RegExp("\\b(" + c.companies.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "i");
      return list.filter(m => want.test(m.issuerName || "") || want.test(m.title || "")).slice(0, c.max).map(m => {
        const text = (m.issuerName || "") + " " + (m.title || "");
        return { tag: c.tag, cls: c.cls, weight: c.weight + (AFRICA.test(text) ? 1 : 0),
          title: m.title || "", source: m.issuerName || m.issuerSign || "Oslo Børs", summary: "", img: "",
          date: new Date(m.publishedTime || m.publishedDate || Date.now()) };
      });
    } catch (e) { note(f, via, e.name === "TimeoutError" ? "tidsavbrudd" : "blokkert eller ikke nåbar"); }
  }
  throw new Error("Newsweb not reachable");
}

async function fetchRaw(f) {
  for (const proxy of CONFIG.proxies) {
    const via = proxy && new URL(proxy).hostname;
    try {
      const res = await fetch(proxy ? proxy + encodeURIComponent(f.url) : f.url, { signal: AbortSignal.timeout(12000) });
      if (!res.ok) { note(f, via, "svar " + res.status); continue; }
      const doc = new DOMParser().parseFromString(await res.text(), "text/xml");
      const its = [...doc.querySelectorAll("item")];
      if (!its.length) { note(f, via, "ingen saker i svaret"); continue; }
      return its.map(it => {
        const txt = sel => it.querySelector(sel)?.textContent || "";
        const media = it.getElementsByTagNameNS(MEDIA, "content")[0] || it.getElementsByTagNameNS(MEDIA, "thumbnail")[0];
        const enc = it.querySelector("enclosure[type^='image']");
        return { title: txt("title"), source: txt("source"), desc: txt("description"), pubDate: txt("pubDate"),
          content: it.getElementsByTagName("content:encoded")[0]?.textContent || "",
          img: media?.getAttribute("url") || enc?.getAttribute("url") || "" };
      });
    } catch (e) { note(f, via, e.name === "TimeoutError" ? "tidsavbrudd" : "blokkert eller ikke nåbar"); }
  }
  // Last resort: rss2json converts the feed to JSON and allows browser access
  let data;
  try {
    const res = await fetch(CONFIG.rss2json + encodeURIComponent(f.url), { signal: AbortSignal.timeout(12000) });
    data = await res.json();
  } catch (e) { note(f, "rss2json", "blokkert eller ikke nåbar"); throw e; }
  if (data.status !== "ok" || !data.items?.length) { note(f, "rss2json", data.message || "ingen saker"); throw new Error("no source answered"); }
  return data.items.map(it => ({ title: it.title || "", source: "", desc: it.description || "", content: it.content || "",
    pubDate: (it.pubDate || "").replace(" ", "T") + "Z", img: it.thumbnail || it.enclosure?.link || "" }));
}

async function loadFeed(f) {
  const raw = await fetchRaw(f);
  return raw.map(r => {
    let title = r.title.trim();
    let source = r.source || f.name;
    const suffix = / - ([^-]{2,40})$/.exec(title); // news search feeds end titles with " - Publisher"
    if (!r.source && suffix && /bing\.com|news\.google/.test(f.url)) { source = suffix[1]; title = title.slice(0, suffix.index); }
    if (title.endsWith(" - " + source)) title = title.slice(0, -(source.length + 3)); // news search feeds append " - Source"
    let summary = strip(r.desc);
    if (summary.startsWith(title)) summary = "";
    const date = new Date(r.pubDate);
    let tag = f.tag, cls = f.cls, weight = f.weight;
    if (f.region) {
      const text = title + " " + summary;
      if (AFRICA.test(text)) { tag = "Offshore · Afrika"; cls = "t-afrika"; weight += 1; }
      else if (NORDIC.test(text)) { tag = "Offshore · Norden"; cls = "t-norden"; weight += 1; }
      else { tag = "Offshore · Globalt"; cls = "t-global"; }
    }
    return { tag, cls, weight, title, source, summary: summary.slice(0, 260), offshore: OFFSHORE.test(title + " " + summary),
      img: safeUrl(r.img || firstImg(r.content) || firstImg(r.desc)),
      date: isNaN(date) ? new Date() : date };
  }).filter(n => !f.onlyOffshore || n.offshore).slice(0, f.max || 8);
}

let items = [], cur = 0, demo = false, failed = [];
function score(n) { return n.date / 3.6e6 + n.weight * 12; } // each weight point counts as 12 hours newer

// News collected server-side (no proxy needed). Returns null when the file is missing, e.g. when the page is opened locally.
async function loadNewsFile() {
  if (location.protocol === "file:") return null;
  try {
    const res = await fetch(CONFIG.newsFile + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.items?.length) return null;
    data.items = data.items.map(n => ({ ...n, img: safeUrl(n.img || ""), date: new Date(n.date) }));
    return data;
  } catch (e) { return null; }
}

async function refresh() {
  diag.length = 0;
  let got = [], results = [];
  const server = await loadNewsFile();
  if (server) {
    got = server.items; failed = server.failed || [];
    results = Array.from({ length: server.sources || got.length }, (_, i) => ({ status: i < (server.sources || 0) - failed.length ? "fulfilled" : "rejected" }));
  } else {
    results = await Promise.allSettled([loadBors(), ...CONFIG.feeds.map(loadFeed)]);
    if (diag.length) console.table(diag);
    const names = ["Oslo Børs", ...CONFIG.feeds.map(f => f.name)];
    failed = names.filter((_, i) => results[i].status === "rejected");
    got = results.flatMap(r => r.status === "fulfilled" ? r.value : []);
  }
  demo = got.length === 0;
  const seen = new Set();
  items = (demo ? DEMO : got).filter(n => n.title && !seen.has(n.title) && seen.add(n.title)).sort((a, b) => score(b) - score(a));
  $("status").textContent = demo ? "demo-modus" : `${results.filter(r => r.status === "fulfilled").length}/${results.length} kilder · ` + new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });
  $("track").innerHTML = items.map(n => `<span>${esc(n.tag)}: ${esc(n.title)}</span>`).join("");
  // Same reading speed however long the text is: duration follows the track's width
  const screens = $("track").scrollWidth / Math.max(window.innerWidth, 1);
  $("track").style.animationDuration = Math.round(screens * CONFIG.tickerSeconds) + "s";
  cur = 0; show();
}

function show() {
  if (!items.length) return;
  const n = items[cur % items.length];
  const f = $("feature");
  f.classList.toggle("has-img", !!n.img);
  const bg = $("fbg"); bg.style.backgroundImage = n.img ? `url("${n.img}")` : "";
  bg.style.animation = "none"; bg.offsetWidth; bg.style.animation = "";
  $("ftxt").outerHTML = `<div class="txt" id="ftxt"><span class="tag ${n.cls}">${esc(n.tag)}</span>
    <h2>${esc(n.title)}</h2>${n.summary ? `<p>${esc(n.summary)}</p>` : ""}
    <span class="meta">${esc(n.source)} · ${ago(n.date)}</span></div>`;
  const p = $("prog"); p.classList.remove("run"); p.offsetWidth; p.style.animationDuration = CONFIG.storySeconds + "s"; p.classList.add("run");

  const next = Array.from({ length: Math.min(CONFIG.listCount, items.length - 1) }, (_, i) => items[(cur + 1 + i) % items.length]);
  $("list").innerHTML = next.map((m, i) => `<li style="animation-delay:${i * 80}ms">
      <span class="thumb" ${m.img ? `style="background-image:url('${m.img}')"` : ""}></span>
      <div><span class="tag ${m.cls}">${esc(m.tag)}</span><h4>${esc(m.title)}</h4><span class="meta">${esc(m.source)} · ${ago(m.date)}</span></div></li>`).join("")
    + (demo ? `<li class="demo-note" style="display:block">Viser eksempler fordi nyhetene ikke kunne hentes. I forhåndsvisningen på claude.ai blokkeres eksterne kilder; åpne filen i en vanlig nettleser for ekte nyheter.<br><br>Feil: ${esc(diag.filter(d => d.startsWith("Oslo Børs")).join(" | ") || "ingen")}</li>` : "")
    + (!demo && failed.length ? `<li class="demo-note" style="display:block">Ikke nådd: ${esc(failed.join(", "))}</li>` : "");
  cur = (cur + 1) % items.length;
}

function ago(d) {
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 60) return m <= 1 ? "nå" : `${m} min siden`;
  if (m < 1440) return `${Math.round(m / 60)} t siden`;
  return d.toLocaleDateString("nb-NO", { day: "numeric", month: "short" });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

refresh();
setInterval(show, CONFIG.storySeconds * 1000);
setInterval(refresh, CONFIG.refreshMinutes * 60000);
navigator.wakeLock?.request("screen").catch(() => {});
</script>
</body>
